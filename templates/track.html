{% extends "base.html" %}
{% block title %}Track your order — {{ cfg.STORE_NAME }}{% endblock %}
{% block content %}
<main class="container page"><div style="max-width:520px;margin:auto"><h1>Track your order</h1>
<form class="panel" method="post">
    <p style="color:var(--muted);margin-bottom:16px">Enter your order number and the phone number used at checkout.</p>
    {% if error %}<div class="alert alert-bad">{{ error }}</div>{% endif %}
    <div class="field"><label for="on">Order number</label><input id="on" name="order_number" placeholder="NX-250101-AB12" required></div>
    <div class="field"><label for="ph">Phone number</label><input id="ph" name="phone" type="tel" required></div>
    <button class="btn btn-block" type="submit">Find my order</button>
</form></div></main>
{% endblock %}
